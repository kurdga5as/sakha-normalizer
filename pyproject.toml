[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sakha-normalizer"
version = "0.1.1"
description = "Sakha (Yakut) chat-text normalizer: 5→ҕ, 8→ө, h/ь→һ, y/у→ү, н→ҥ — for machines, not for correcting people"
readme = "README.md"
license = {text = "MIT (code), CC BY-SA 4.0 (data)"}
requires-python = ">=3.8"
dependencies = []

[tool.setuptools]
packages = ["sakha_normalizer"]

[tool.setuptools.package-data]
sakha_normalizer = ["data/*.tsv.gz", "data/*.json"]
